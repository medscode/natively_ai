name: Release (Windows x64)

# Builds Windows release packages (NSIS Installer .exe + Portable .exe)
# on a Windows runner, compiling the Rust WASAPI audio native module
# (index.win32-x64-msvc.node) and packaging via electron-builder.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # manual trigger uses branch/tag selected in Actions UI

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download fallback models and sqlite-vec assets
        run: |
          node scripts/download-models.js
          node scripts/ensure-sqlite-vec.js

      - name: Rebuild native dependencies for Electron
        run: npx @electron/rebuild -f -w better-sqlite3,keytar

      - name: Build Rust native audio module
        run: npm run build:native

      - name: Verify packaged local fallback assets
        run: node scripts/verify-packaged-local-assets.mjs

      - name: Build Windows release packages
        run: node scripts/build-win.js

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natively-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Upload to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
